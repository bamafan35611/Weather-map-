<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>NorthBamaWX - Complete Weather Intelligence</title>
<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet"/>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

<style>
html, body { height: 100%; margin: 0; padding: 0; }
body { font-family: Arial, Helvetica, sans-serif; }
#map { 
  height: calc(100vh - 48px); 
  border: 3px solid #00ffff !important; 
  border-radius: 4px;
  box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
}
header { 
  height: 48px; 
  padding: 8px 12px; 
  background: #0b67a3; 
  color: #fff; 
  display: flex; 
  align-items: center; 
  gap: 12px; 
  border-bottom: 2px solid #ffffff !important; 
}
#radar-timestamp { 
  position: fixed; 
  bottom: 20px; 
  right: 15px; 
  background: rgba(0,0,0,0.75); 
  color: #ffff88; 
  padding: 6px 10px; 
  border-radius: 6px; 
  font-size: 14px; 
  font-weight: bold; 
  z-index: 1001; 
  border: 2px solid #ffffff !important; 
}
.mapboxgl-popup {
  max-width: 400px;
}
.mapboxgl-popup-content {
  background: rgba(0, 0, 0, 0.95);
  color: #fff;
  padding: 15px;
  border-radius: 8px;
  border: 2px solid #ff0000;
}
.popup-title {
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 10px;
  color: #ff6666;
}
.popup-details {
  font-size: 13px;
  line-height: 1.5;
}
</style>
</head>
<body>
<header>
<strong>NorthBamaWX - Complete Weather Intelligence</strong>
<div style="margin-left:auto">Python Backend + Full Map Features</div>
</header>

<div id="map"></div>
<div id="radar-timestamp">Radar: Initializing...</div>

<script>
console.log("=".repeat(80));
console.log("NorthBamaWX - COMPLETE VERSION");
console.log("Python Backend Broadcasts + Full Map Visualization");
console.log("=".repeat(80));

// Configuration
const MAPBOX_TOKEN = 'pk.eyJ1Ijoibm9ydGhiYW1hd3giLCJhIjoiY21mMXZ6aGdlMmhlMjJqcG9qMzQ2MXRmZyJ9.HnDHg4NTHSUVfgBvh4rXWw';
const __api_qp = new URLSearchParams(location.search);
const BACKEND_BASE_URL = (__api_qp.get('api')) ||
  ((location.hostname.includes('render.com') || location.hostname.endsWith('onrender.com')) 
    ? '' 
    : 'https://weather-map-71ep.onrender.com');

const HOME_CENTER = [-86.8, 34.8];
const HOME_ZOOM = 8.1;
const RADAR_REFRESH_INTERVAL = 300; // 5 minutes

// Voice relay settings
const USE_VOICE_RELAY = true;
const VOICE_RELAY_URL = 'ws://localhost:8765';

let voiceRelayWS = null;
let voiceRelayConnected = false;
let voiceRelayConnecting = false;
let map;
let backendConnected = false;

// Briefing coordination
let _briefingInProgress = false;
let _lastBriefingCheck = 0;
let _lastBroadcastMinute = -1;

// ========================================
// VOICE RELAY CONNECTION
// ========================================

function connectVoiceRelay() {
    if (!USE_VOICE_RELAY) {
        console.log('[voice-relay] Relay disabled');
        return;
    }

    // GUARD: Prevent duplicate connections
    if (voiceRelayConnecting || (voiceRelayWS && voiceRelayWS.readyState === WebSocket.OPEN)) {
        console.log('[voice-relay] Already connected or connecting, skipping...');
        return;
    }

    voiceRelayConnecting = true;

    try {
        console.log(`[voice-relay] Connecting to ${VOICE_RELAY_URL}...`);
        voiceRelayWS = new WebSocket(VOICE_RELAY_URL);

        voiceRelayWS.onopen = () => {
            voiceRelayConnected = true;
            voiceRelayConnecting = false;
            console.log('[voice-relay] ✅ Connected to relay server');
            
            voiceRelayWS.send(JSON.stringify({
                type: 'identify',
                client: 'obs'
            }));
        };

        voiceRelayWS.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.status === 'connected' && data.role === 'obs') {
                    console.log('[voice-relay] Registered as OBS client');
                }
            } catch (error) {
                console.error('[voice-relay] Message parse error:', error);
            }
        };

        voiceRelayWS.onerror = (error) => {
            voiceRelayConnected = false;
            voiceRelayConnecting = false;
            console.error('[voice-relay] WebSocket error');
        };

        voiceRelayWS.onclose = () => {
            voiceRelayConnected = false;
            voiceRelayConnecting = false;
            console.log('[voice-relay] Disconnected. Reconnecting in 5 seconds...');
            setTimeout(connectVoiceRelay, 5000);
        };
    } catch (error) {
        voiceRelayConnected = false;
        voiceRelayConnecting = false;
        console.error('[voice-relay] Connection failed:', error);
        setTimeout(connectVoiceRelay, 5000);
    }
}

// ========================================
// PYTHON BACKEND BROADCASTS
// ========================================

function checkForBriefing() {
    const now = new Date();
    const minute = now.getMinutes();
    
    const isBriefingTime = (minute === 0 || minute === 15 || minute === 30 || minute === 45);
    
    if (isBriefingTime && !_briefingInProgress) {
        const currentTime = now.getTime();
        const timeSinceLastCheck = currentTime - _lastBriefingCheck;
        
        if (timeSinceLastCheck > 60000) {
            console.log(`[Briefing] ⏰ Briefing time detected (XX:${minute.toString().padStart(2, '0')})`);
            runPythonBackendBroadcast();
            _lastBriefingCheck = currentTime;
        }
    }
}

async function runPythonBackendBroadcast() {
    const now = new Date();
    const currentMinute = now.getMinutes();
    
    // GUARD: Prevent duplicate broadcasts in the same minute
    if (currentMinute === _lastBroadcastMinute) {
        console.log('[Python Backend] Already broadcast this minute, skipping...');
        return;
    }
    
    _lastBroadcastMinute = currentMinute;
    
    try {
        console.log('[Python Backend] Fetching broadcast from /api/broadcast/scheduled');
        const response = await fetch('/api/broadcast/scheduled');
        
        if (!response.ok) {
            console.error('[Python Backend] HTTP error:', response.status);
            return;
        }
        
        const data = await response.json();
        
        if (!data.success || !data.combined_text) {
            console.log('[Python Backend] No broadcast available');
            return;
        }
        
        const text = data.combined_text;
        console.log(`[Python Backend] Got broadcast: ${text.substring(0, 50)}...`);
        
        if (typeof voiceRelayWS !== 'undefined' && voiceRelayWS && voiceRelayWS.readyState === WebSocket.OPEN) {
            voiceRelayWS.send(JSON.stringify({
                type: 'speak',
                text: text,
                rate: 1.0
            }));
            console.log('[Python Backend] Sent to voice relay');
        } else {
            console.warn('[Python Backend] Voice relay not connected!');
        }
        
    } catch (error) {
        console.error('[Python Backend] Error:', error);
    }
}

// ========================================
// ALERT COLOR CODING
// ========================================

function getAlertColor(eventType) {
    const event = (eventType || '').toLowerCase();
    
    // Warnings (Red shades)
    if (event.includes('tornado warning')) return '#FF0000';
    if (event.includes('severe thunderstorm warning')) return '#FFA500';
    if (event.includes('flash flood warning')) return '#8B0000';
    if (event.includes('flood warning')) return '#00FF00';
    
    // Watches (Yellow shades)
    if (event.includes('tornado watch')) return '#FFFF00';
    if (event.includes('severe thunderstorm watch')) return '#FFD700';
    if (event.includes('flood watch')) return '#2E8B57';
    
    // Advisories (Blue shades)
    if (event.includes('winter storm')) return '#FF69B4';
    if (event.includes('ice')) return '#9370DB';
    
    // Default
    return '#00BFFF';
}

// ========================================
// MAP INITIALIZATION
// ========================================

function initializeMap() {
    console.log("Initializing Mapbox GL JS...");
    
    mapboxgl.accessToken = MAPBOX_TOKEN;
    
    map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/dark-v10',
        center: HOME_CENTER,
        zoom: HOME_ZOOM,
        projection: 'mercator'
    });
    
    map.on('load', async () => {
        console.log("✅ Map loaded");
        
        // Add state borders
        addStateBorders();
        
        // Add radar layer
        addRadarLayer();
        
        // Add county borders
        addCountyBorders();
        
        // Initialize alert layers
        initAlertsLayers();
        
        // Fetch and display alerts
        await fetchAlerts();
        
        // Fetch and display outlooks
        await fetchOutlooks();
        
        // Fetch and display watches
        await fetchWatches();
        
        // Refresh alerts every 60 seconds
        setInterval(fetchAlerts, 60000);
        
        // Refresh outlooks every 5 minutes
        setInterval(fetchOutlooks, 300000);
        
        // Refresh watches every 5 minutes
        setInterval(fetchWatches, 300000);
        
        console.log("[Broadcast] System active - updates at :00, :15, :30, :45");
        console.log("[Map] All layers loaded - alerts, radar, outlooks, watches");
    });
}

// ========================================
// STATE BORDERS
// ========================================

function addStateBorders() {
    console.log("Loading US state borders...");
    
    map.addSource('states', {
        type: 'vector',
        url: 'mapbox://mapbox.us_census_states_2015'
    });
    
    map.addLayer({
        id: 'state-borders',
        type: 'line',
        source: 'states',
        'source-layer': 'states',
        paint: {
            'line-color': '#ffffff',
            'line-width': 2,
            'line-opacity': 0.5
        }
    });
    
    console.log("✓ State borders added");
}

// ========================================
// RADAR LAYER
// ========================================

function addRadarLayer() {
    console.log("Adding NEXRAD radar layer...");
    
    map.addSource('radar', {
        type: 'raster',
        tiles: [`https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913/{z}/{x}/{y}.png?_t=${Date.now()}`],
        tileSize: 256
    });
    
    map.addLayer({
        id: 'radar-layer',
        type: 'raster',
        source: 'radar',
        paint: {
            'raster-opacity': 0.6
        }
    });
    
    updateRadarTimestamp();
    setInterval(refreshRadar, RADAR_REFRESH_INTERVAL * 1000);
    
    console.log("✓ Radar layer added");
}

function refreshRadar() {
    if (map.getSource('radar')) {
        map.getSource('radar').tiles = [
            `https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913/{z}/{x}/{y}.png?_t=${Date.now()}`
        ];
        updateRadarTimestamp();
        console.log("🔄 Radar refreshed");
    }
}

function updateRadarTimestamp() {
    const timestamp = new Date().toLocaleTimeString();
    document.getElementById('radar-timestamp').textContent = `Radar: ${timestamp}`;
}

// ========================================
// COUNTY BORDERS
// ========================================

function addCountyBorders() {
    console.log("Setting up zoom-based county visibility...");
    
    fetch('https://raw.githubusercontent.com/plotly/datasets/master/geojson-counties-fips.json')
        .then(response => response.json())
        .then(data => {
            map.addSource('counties', {
                type: 'geojson',
                data: data
            });
            
            map.addLayer({
                id: 'county-fills',
                type: 'fill',
                source: 'counties',
                paint: {
                    'fill-color': 'transparent',
                    'fill-opacity': 0
                }
            });
            
            map.addLayer({
                id: 'county-borders',
                type: 'line',
                source: 'counties',
                paint: {
                    'line-color': '#888888',
                    'line-width': [
                        'interpolate',
                        ['linear'],
                        ['zoom'],
                        7, 0,
                        8, 0.5,
                        10, 1
                    ],
                    'line-opacity': [
                        'interpolate',
                        ['linear'],
                        ['zoom'],
                        7, 0,
                        8, 0.3,
                        10, 0.7
                    ]
                }
            });
            
            console.log("✓ County system ready");
        })
        .catch(error => console.error("Error loading counties:", error));
}

// ========================================
// ALERTS
// ========================================

function initAlertsLayers() {
    map.addSource('alerts', {
        type: 'geojson',
        data: { type: 'FeatureCollection', features: [] }
    });
    
    map.addLayer({
        id: 'alert-fills',
        type: 'fill',
        source: 'alerts',
        paint: {
            'fill-color': ['get', 'color'],
            'fill-opacity': 0.3
        }
    });
    
    map.addLayer({
        id: 'alert-borders',
        type: 'line',
        source: 'alerts',
        paint: {
            'line-color': ['get', 'color'],
            'line-width': 3
        }
    });
    
    // Click handler for alerts
    map.on('click', 'alert-fills', (e) => {
        if (e.features.length > 0) {
            showAlertPopup(e);
        }
    });
    
    map.on('mouseenter', 'alert-fills', () => {
        map.getCanvas().style.cursor = 'pointer';
    });
    
    map.on('mouseleave', 'alert-fills', () => {
        map.getCanvas().style.cursor = '';
    });
}

async function fetchAlerts() {
    try {
        const MONITORED_ZONES = [
            'ALC033', 'ALC043', 'ALC049', 'ALC059', 'ALC071', 'ALC079',
            'ALC077', 'ALC083', 'ALC089', 'ALC095', 'ALC103',
            'TNC051', 'TNC103', 'TNC127'
        ];
        
        const zoneQuery = MONITORED_ZONES.map(zone => `zone=${zone}`).join('&');
        const response = await fetch(`https://api.weather.gov/alerts/active?${zoneQuery}`, {
            headers: {'Accept': 'application/geo+json'}
        });
        
        if (!response.ok) {
            console.error("NWS API error:", response.status);
            return;
        }
        
        const data = await response.json();
        const features = (data.features || []).map(feature => ({
            ...feature,
            properties: {
                ...feature.properties,
                color: getAlertColor(feature.properties.event)
            }
        }));
        
        const alertsGeoJSON = {
            type: 'FeatureCollection',
            features: features
        };
        
        map.getSource('alerts').setData(alertsGeoJSON);
        console.log(`✓ Updated ${features.length} alerts on map`);
        
    } catch (error) {
        console.error("Error fetching alerts:", error);
    }
}

function showAlertPopup(e) {
    const feature = e.features[0];
    const props = feature.properties;
    
    const html = `
        <div class="popup-title">${props.event}</div>
        <div class="popup-details">
            <strong>Area:</strong> ${props.areaDesc}<br>
            <strong>Severity:</strong> ${props.severity}<br>
            <strong>Urgency:</strong> ${props.urgency}<br>
            <strong>Headline:</strong> ${props.headline || 'N/A'}
        </div>
    `;
    
    new mapboxgl.Popup()
        .setLngLat(e.lngLat)
        .setHTML(html)
        .addTo(map);
}

// ========================================
// SPC OUTLOOKS
// ========================================

async function fetchOutlooks() {
    try {
        const response = await fetch((BACKEND_BASE_URL || '') + '/api/weather/outlooks');
        if (!response.ok) {
            console.log("SPC outlooks not available from backend");
            return;
        }
        
        const data = await response.json();
        const outlooks = data.outlooks || [];
        
        if (outlooks.length === 0) {
            console.log("No SPC outlooks available");
            return;
        }
        
        const outlooksGeoJSON = {
            type: 'FeatureCollection',
            features: outlooks
        };
        
        if (!map.getSource('outlooks')) {
            map.addSource('outlooks', { type: 'geojson', data: outlooksGeoJSON });
            map.addLayer({
                id: 'outlook-fills',
                type: 'fill',
                source: 'outlooks',
                paint: {
                    'fill-color': ['get', 'fill'],
                    'fill-opacity': 0.2
                }
            });
            map.addLayer({
                id: 'outlook-borders',
                type: 'line',
                source: 'outlooks',
                paint: {
                    'line-color': ['get', 'stroke'],
                    'line-width': 2
                }
            });
        } else {
            map.getSource('outlooks').setData(outlooksGeoJSON);
        }
        
        console.log(`✓ Updated ${outlooks.length} SPC outlooks`);
        
    } catch (error) {
        console.error("Error fetching outlooks:", error);
    }
}

// ========================================
// WATCHES
// ========================================

async function fetchWatches() {
    try {
        const response = await fetch('https://api.weather.gov/alerts/active?status=actual&message_type=alert', {
            headers: {'Accept': 'application/geo+json'}
        });
        
        if (!response.ok) {
            console.error("Error fetching watches:", response.status);
            return;
        }
        
        const data = await response.json();
        const watchFeatures = (data.features || []).filter(f => 
            (f.properties.event || '').toLowerCase().includes('watch')
        );
        
        const watchesGeoJSON = {
            type: 'FeatureCollection',
            features: watchFeatures.map(feature => ({
                ...feature,
                properties: {
                    ...feature.properties,
                    color: getAlertColor(feature.properties.event)
                }
            }))
        };
        
        if (!map.getSource('watches')) {
            map.addSource('watches', { type: 'geojson', data: watchesGeoJSON });
            map.addLayer({
                id: 'watch-fills',
                type: 'fill',
                source: 'watches',
                paint: {
                    'fill-color': ['get', 'color'],
                    'fill-opacity': 0.15
                }
            });
            map.addLayer({
                id: 'watch-borders',
                type: 'line',
                source: 'watches',
                paint: {
                    'line-color': ['get', 'color'],
                    'line-width': 2,
                    'line-dasharray': [2, 2]
                }
            });
        } else {
            map.getSource('watches').setData(watchesGeoJSON);
        }
        
        console.log(`✓ Updated ${watchFeatures.length} watches`);
        
    } catch (error) {
        console.error("Error fetching watches:", error);
    }
}

// ========================================
// INITIALIZATION
// ========================================

document.addEventListener('DOMContentLoaded', async () => {
    console.log("Initializing NorthBamaWX - Complete System");
    
    // Initialize map
    initializeMap();
    
    // Connect to voice relay
    if (USE_VOICE_RELAY) {
        console.log("Connecting to voice relay...");
        connectVoiceRelay();
    }
    
    // Test backend connection
    try {
        const response = await fetch((BACKEND_BASE_URL || '') + '/api/test');
        if (response.ok) {
            const data = await response.json();
            console.log("✅ Backend connected!", data);
            backendConnected = true;
        }
    } catch (error) {
        console.log("⚠️ Backend connection failed - using offline mode");
        backendConnected = false;
    }
    
    // Start broadcast scheduler
    setInterval(() => {
        try { checkForBriefing(); } catch(e){}
    }, 1000);
    
    console.log("✅ System ready - Python backend + Full map features");
});

console.log("=".repeat(80));
console.log("✅ NorthBamaWX COMPLETE - Ready for deployment");
console.log("=".repeat(80));
</script>

</body>
</html>
